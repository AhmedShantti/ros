        - description: The order's current ETag (W/"<orderId>.<version>") or a bare version integer. Not "*".
          in: header
          name: if-match
          required: true
          schema:
            type: string
        - description: 'Opaque client-chosen key. A replay with the same key and request body returns the original result unchanged (Idempotent-Replay: true) — no second Payment, no second paid_total increment.'
