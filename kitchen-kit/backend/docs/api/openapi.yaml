components:
  schemas:
    AcknowledgeViewedDto:
      properties:
        ticketIds:
          items:
            type: string
          maxItems: 200
          minItems: 1
          type: array
          uniqueItems: true
      required:
        - ticketIds
      type: object
    AddFingerprintDto:
      properties:
        appVersion:
          maxLength: 32
          type: string
        deviceFingerprint:
          maxLength: 1024
          type: string
        os:
          maxLength: 32
          type: string
      required:
        - deviceFingerprint
      type: object
    AddLineModifierDto:
      properties:
        modifierId:
          type: string
        quantity:
          maximum: 999
          minimum: 1
          type: number
      required:
        - modifierId
      type: object
    AddOrderLineDto:
      properties:
        course:
          maximum: 99
          minimum: 1
          type: number
        id:
          description: FR-OFF-015 — the ULID the device assigned to this line.
          type: string
        menuItemId:
          type: string
        modifiers:
          items:
            $ref: '#/components/schemas/AddLineModifierDto'
          maxItems: 50
          type: array
        notes:
          maxLength: 500
          type: string
        quantity:
          description: |-
            DECIMAL(12,3) carried as an exact string end to end (BR-CORE-003). A JSON
            number could not represent 0.001 exactly and must never price a sale.
          pattern: ^(?!0+(\.0+)?$)\d{1,9}(\.\d{1,3})?$
          type: string
        seatNumber:
          maximum: 999
          minimum: 1
          type: number
        variantId:
          type: string
      required:
        - menuItemId
        - variantId
        - quantity
      type: object
    AddPermissionsDto:
      properties:
        permissionCodes:
          items:
            maxLength: 80
            type: string
          minItems: 1
          type: array
      required:
        - permissionCodes
      type: object
    AddSubstituteMemberDto:
      properties:
        stockItemId:
          type: string
      required:
        - stockItemId
      type: object
    AssignBranchDto:
      properties:
        branchId:
          type: string
      required:
        - branchId
      type: object
    AssignRoleDto:
      properties:
        roleId:
          type: string
      required:
        - roleId
      type: object
    BindTerminalDto:
      properties:
        terminalId:
          type: string
      required:
        - terminalId
      type: object
    CapturePaymentDto:
      properties:
        amountMinor:
          description: |-
            The amount this Payment applies toward the order, in MINOR units, as an
            exact integer string (ADR-008 — never a JSON number). For CASH, the
            EXACT amount being settled — never the cash-rounded figure, which the
            server derives from `tenderedAmountMinor` and the order's pinned
            country pack.
          pattern: ^\d{1,18}$
          type: string
        authorizationCode:
          description: Optional.
          maxLength: 32
          type: string
        cardScheme:
          description: Optional, only when the cashier supplies it (FR-POS-066 permitted metadata).
          maxLength: 32
          type: string
        cashSessionId:
          type: string
        id:
          description: FR-OFF-015 — the ULID the device assigned to this Payment.
          type: string
        last4:
          description: Optional. Exactly 4 digits when present — never more (FR-POS-066).
          pattern: ^\d{4}$
          type: string
        tender:
          enum:
            - cash
            - manual_external_card
          type: string
        tenderedAmountMinor:
          description: REQUIRED for CASH; refused for MANUAL_EXTERNAL_CARD.
          pattern: ^\d{1,18}$
          type: string
        terminalReference:
          description: |-
            REQUIRED for MANUAL_EXTERNAL_CARD; refused for CASH. The cashier's own
            record of the already-completed EXTERNAL terminal transaction — never a
            ROS-side integrated-terminal session id (FR-POS-064 is not implemented).
          maxLength: 64
          type: string
      required:
        - tender
        - amountMinor
        - cashSessionId
      type: object
    CashMovementDto:
      properties:
        amountMinor:
          description: |-
            Positive integer minor units, as an exact string (ADR-008: money is never
            a JSON number). The movement TYPE (the route) supplies the sign — a
            client can never submit a negative amount.
          pattern: ^(?!0+$)\d{1,18}$
          type: string
        id:
          description: FR-OFF-015 — the device's permanent ULID for this movement. REQUIRED.
          type: string
        occurredAt:
          description: Device-declared instant. Defaults to server receipt time if omitted.
          type: string
        reason:
          description: FR-POS-091 [M] — mandatory for ALL THREE movement types. Non-blank.
          maxLength: 500
          pattern: \S
          type: string
      required:
        - id
        - amountMinor
        - reason
      type: object
    ChangeBaseUnitDto:
      properties:
        baseUnitId:
          type: string
      required:
        - baseUnitId
      type: object
    ChangePasswordDto:
      properties:
        currentPassword:
          minLength: 1
          type: string
        newPassword:
          maxLength: 256
          minLength: 8
          type: string
      required:
        - currentPassword
        - newPassword
      type: object
    CreateAvailabilityRuleDto:
      properties:
        branchId:
          type: string
        channel:
          maxLength: 16
          minLength: 1
          type: string
        dayOfWeek:
          maximum: 6
          minimum: 0
          type: number
        endsAt:
          pattern: ^([01]\d|2[0-3]):[0-5]\d(?::[0-5]\d)?$
          type: string
        menuItemId:
          type: string
        startsAt:
          pattern: ^([01]\d|2[0-3]):[0-5]\d(?::[0-5]\d)?$
          type: string
        variantId:
          type: string
      type: object
    CreateBranchDto:
      properties:
        address:
          additionalProperties: true
          type: object
        automaticAvailability:
          type: boolean
        baseCurrency:
          maxLength: 3
          minLength: 3
          pattern: ^[A-Z]{3}$
          type: string
        brandId:
          type: string
        code:
          maxLength: 16
          minLength: 1
          type: string
        countryCode:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Z]{2}$
          type: string
        name:
          maxLength: 120
          minLength: 1
          type: string
        timezone:
          maxLength: 48
          minLength: 1
          type: string
      required:
        - brandId
        - code
        - name
        - timezone
        - baseCurrency
        - countryCode
      type: object
    CreateBrandDto:
      properties:
        defaultSettings:
          additionalProperties: true
          type: object
        name:
          maxLength: 120
          minLength: 1
          type: string
        theme:
          additionalProperties: true
          type: object
      required:
        - name
      type: object
    CreateCashClosePolicyDto:
      properties:
        countMode:
          description: FR-POS-094/095. Omitted = the source-stated default, `blind`.
          enum:
            - open
            - blind
          type: string
        effectiveFrom:
          description: |-
            R-3(a)/C-2. Omitted = effective immediately (resolved to DATABASE time,
            never this process's clock). Supplied = an explicit future activation
            instant; a past instant is rejected (C-2 - enforced by the DB CHECK, not
            merely this validator).
          type: string
        varianceApprovalExpirySeconds:
          description: 'R-4(a): configured positive duration. No default exists anywhere.'
          minimum: 1
          type: number
        varianceToleranceMinorUnits:
          description: |-
            R-1(a): absolute non-negative minor units, as an exact integer string.
            A JSON number is IEEE-754 and money must never pass through one
            (ADR-008) - mirrors `OpenCashSessionDto.openingFloat` exactly, including
            zero being a VALID tolerance (unlike a positive-amount field).
          pattern: ^\d{1,18}$
          type: string
      required:
        - varianceToleranceMinorUnits
        - varianceApprovalExpirySeconds
      type: object
    CreateCategoryDto:
      properties:
        colour:
          maxLength: 9
          minLength: 1
          type: string
        name:
          additionalProperties: true
          type: object
        parentCategoryId:
          type: string
        sortOrder:
          maximum: 32767
          minimum: -32768
          type: number
      required:
        - name
      type: object
    CreateCentralKitchenDto:
      properties:
        name:
          maxLength: 120
          minLength: 1
          type: string
        warehouseId:
          type: string
      required:
        - name
        - warehouseId
      type: object
    CreateMenuDto:
      properties:
        activeWindow:
          additionalProperties: true
          type: object
        name:
          additionalProperties: true
          type: object
        orderTypes:
          description: FR-MNU-002. Vocabulary owned by Sales; stored as text (no Sales dependency).
          items:
            type: string
          type: array
        priority:
          maximum: 32767
          minimum: -32768
          type: number
      required:
        - name
      type: object
    CreateMenuItemDto:
      properties:
        aggregatorNames:
          additionalProperties: true
          type: object
        allergens:
          items:
            type: string
          type: array
        barcodePlu:
          maxLength: 32
          minLength: 1
          type: string
        colour:
          maxLength: 9
          minLength: 1
          type: string
        description:
          additionalProperties: true
          type: object
        dietaryTags:
          items:
            type: string
          type: array
        isCombo:
          type: boolean
        isOpenPrice:
          type: boolean
        isWeighed:
          type: boolean
        kitchenNames:
          additionalProperties: true
          type: object
        names:
          additionalProperties: true
          type: object
        revenueAccountCode:
          maxLength: 32
          minLength: 1
          type: string
        sortOrder:
          maximum: 32767
          minimum: -32768
          type: number
        taxClassId:
          description: 'C-04: recorded only. Fiscal is out of scope, so this is never resolved.'
          type: string
      required:
        - names
      type: object
    CreateModifierDto:
      properties:
        consumptionQuantity:
          pattern: ^-?\d+(\.\d{1,6})?$
          type: string
        consumptionUnitId:
          type: string
        isDefault:
          type: boolean
        kind:
          description: |-
            FR-POS-021 [M]. REQUIRED — P1E-5. Pre-existing rows may carry `kind:
            null` (no non-heuristic source data could classify them; see the
            catalogue-modifier-kind migration header), but every NEW modifier
            created through this API must state its semantic kind explicitly.
          enum:
            - addition
            - removal
            - substitution
          type: string
        name:
          additionalProperties: true
          type: object
        priceDelta:
          description: Minor units as an integer string, so BIGINT precision survives JSON.
          pattern: ^-?\d{1,18}$
          type: string
        recipeDelta:
          additionalProperties: true
          description: 'FR-MNU-013: opaque JSON — Production Spec is not implemented.'
          type: object
        sortOrder:
          maximum: 32767
          minimum: -32768
          type: number
        stockItemId:
          description: 'FR-MNU-012: recorded only — Inventory is out of scope.'
          type: string
      required:
        - name
        - kind
      type: object
    CreateModifierGroupDto:
      properties:
        allowRepeat:
          type: boolean
        freeQuantityThreshold:
          maximum: 32767
          minimum: 0
          type: number
        isRequired:
          type: boolean
        maxSelections:
          maximum: 32767
          minimum: 0
          type: number
        minSelections:
          maximum: 32767
          minimum: 0
          type: number
        name:
          additionalProperties: true
          type: object
      required:
        - name
      type: object
    CreateOperatingHoursDto:
      properties:
        businessDayCutover:
          type: string
        closesAt:
          type: string
        dayOfWeek:
          maximum: 6
          minimum: 0
          type: number
        opensAt:
          type: string
      required:
        - dayOfWeek
        - opensAt
        - closesAt
      type: object
    CreateOrderDto:
      properties:
        channel:
          enum:
            - pos
            - kiosk
            - qr
            - aggregator
            - phone
            - api
          type: string
        guestCount:
          maximum: 32767
          minimum: 1
          type: number
        id:
          description: |-
            FR-OFF-015 — the ULID the device already assigned. Preserved exactly, so an
            order created offline keeps one identity for its whole life.
          type: string
        notes:
          maxLength: 2000
          type: string
        openedByEmployeeId:
          description: Optional for a PIN session, where the employee comes from the token.
          type: string
        orderType:
          enum:
            - dine_in
            - takeaway
            - delivery
            - drive_thru
            - pickup
            - aggregator
          type: string
        originDeviceTime:
          description: |-
            FR-OFF-015 — the device's own clock reading for the sale. Recorded as
            `origin_device_time`; it never decides the business day.
          type: string
        tableId:
          type: string
        terminalId:
          description: |-
            The terminal the sale is on. Optional for a terminal-bound session, where
            it is taken from the token; when supplied it must MATCH the bound terminal.
          type: string
      required:
        - orderType
        - channel
        - originDeviceTime
      type: object
    CreatePriceListDto:
      properties:
        name:
          maxLength: 120
          minLength: 1
          type: string
        orderType:
          maxLength: 16
          minLength: 1
          type: string
        priority:
          maximum: 32767
          minimum: -32768
          type: number
        recurrenceRule:
          additionalProperties: true
          type: object
        scopeId:
          type: string
        scopeType:
          description: 'C-06: `branch_group` is intentionally absent from the enum.'
          enum:
            - branch
            - tenant
            - brand
          type: string
        status:
          enum:
            - scheduled
            - active
            - expired
          type: string
        validFrom:
          type: string
        validTo:
          type: string
      required:
        - name
        - scopeType
      type: object
    CreatePrintRoutingDto:
      properties:
        documentType:
          enum:
            - receipt
            - kitchen_ticket
            - bar_ticket
          type: string
        printerTarget:
          maxLength: 64
          minLength: 1
          type: string
        stationId:
          type: string
      required:
        - documentType
        - printerTarget
      type: object
    CreateReasonCodeDto:
      properties:
        category:
          maxLength: 16
          minLength: 1
          type: string
        code:
          maxLength: 32
          minLength: 1
          type: string
        label:
          additionalProperties: true
          type: object
      required:
        - category
        - code
        - label
      type: object
    CreateRecipeDto:
      properties:
        branchId:
          description: 'D-17-03: required for `branch` scope, forbidden otherwise.'
          type: string
        brandId:
          description: 'D-17-03: required for `brand` scope, forbidden otherwise.'
          type: string
        menuItemVariantId:
          description: Required when `recipeType = menu_item`.
          type: string
        recipeType:
          enum:
            - menu_item
            - sub_recipe
            - production_item
          type: string
        scope:
          enum:
            - tenant
            - brand
            - branch
          type: string
        stockItemId:
          description: Required when `recipeType` is `sub_recipe` or `production_item`.
          type: string
      required:
        - scope
        - recipeType
      type: object
    CreateRecipeVersionDto:
      properties:
        effectiveFrom:
          description: |-
            D-17-08 Q2 — INFORMATIONAL ONLY. Accepted, stored and returned. It is
            never read by publish, resolution or any selection predicate.
          type: string
        instructions:
          additionalProperties: true
          type: object
        lines:
          items:
            $ref: '#/components/schemas/RecipeLineDto'
          type: array
        prepTimeSeconds:
          minimum: 0
          type: number
        referenceImages:
          additionalProperties: true
          type: object
        yieldPercentage:
          type: string
        yieldQuantity:
          type: string
        yieldUnitId:
          type: string
      required:
        - yieldQuantity
        - yieldUnitId
      type: object
    CreateRoleDto:
      properties:
        description:
          maxLength: 500
          type: string
        name:
          maxLength: 64
          minLength: 1
          type: string
      required:
        - name
      type: object
    CreateStationDto:
      properties:
        capacityConfig:
          additionalProperties: true
          type: object
        displayColour:
          maxLength: 9
          minLength: 1
          type: string
        displayTerminalId:
          type: string
        name:
          maxLength: 64
          minLength: 1
          type: string
      required:
        - name
      type: object
    CreateStationRoutingRuleDto:
      properties:
        categoryId:
          type: string
        menuItemId:
          type: string
        modifierId:
          type: string
        priority:
          maximum: 32767
          minimum: -32768
          type: number
        stationId:
          type: string
      required:
        - stationId
      type: object
    CreateStockItemDto:
      properties:
        baseUnitId:
          type: string
        batchStrategy:
          enum:
            - fifo
            - fefo
          type: string
        categoryId:
          type: string
        costingMethod:
          enum:
            - weighted_average
            - fifo
            - standard
          type: string
        expiryTracked:
          type: boolean
        isBatchTracked:
          type: boolean
        names:
          additionalProperties: true
          type: object
        recipeUnitId:
          type: string
        shelfLifeDays:
          minimum: 0
          type: number
        sku:
          maxLength: 32
          minLength: 1
          type: string
        standardCost:
          type: string
        storageRequirements:
          additionalProperties: true
          type: object
      required:
        - sku
        - names
        - baseUnitId
      type: object
    CreateSubstituteGroupDto:
      properties:
        name:
          maxLength: 120
          type: string
        stockItemIds:
          items:
            type: string
          type: array
      required:
        - name
      type: object
    CreateTableDto:
      properties:
        label:
          maxLength: 16
          minLength: 1
          type: string
        seatCapacity:
          maximum: 32767
          minimum: 1
          type: number
        section:
          maxLength: 64
          minLength: 1
          type: string
      required:
        - label
      type: object
    CreateVariantDto:
      properties:
        barcode:
          maxLength: 32
          minLength: 1
          type: string
        name:
          additionalProperties: true
          type: object
        prepTimeSeconds:
          minimum: 0
          type: number
        sortOrder:
          maximum: 32767
          minimum: -32768
          type: number
      required:
        - name
      type: object
    CreateWarehouseDto:
      properties:
        branchId:
          type: string
        name:
          maxLength: 120
          minLength: 1
          type: string
        warehouseType:
          enum:
            - branch
            - central
            - virtual
          type: string
      required:
        - name
      type: object
    DeclareCashSessionCloseDto:
      properties:
        closeAttemptId:
          description: FR-OFF-015 — the device's permanent ULID for this close attempt. REQUIRED.
          type: string
        countedTotalMinorUnits:
          description: Non-negative integer minor units, as an exact string. Zero is valid.
          pattern: ^\d{1,18}$
          type: string
        denominations:
          items:
            $ref: '#/components/schemas/DenominationCountDto'
          minItems: 1
          type: array
      required:
        - closeAttemptId
      type: object
    DenominationCountDto:
      properties:
        denominationMinorUnits:
          description: Positive integer minor units, as an exact string (never a JSON number).
          pattern: ^[1-9]\d{0,17}$
          type: string
        quantity:
          minimum: 1
          type: number
      required:
        - denominationMinorUnits
        - quantity
      type: object
    DispatchTransferDto:
      properties:
        fromLocationId:
          type: string
        notes:
          maxLength: 500
          minLength: 1
          type: string
        quantity:
          type: string
        reasonCodeId:
          type: string
        stockItemId:
          type: string
        toLocationId:
          type: string
      required:
        - stockItemId
        - fromLocationId
        - toLocationId
        - quantity
      type: object
    ErrorResponse:
      description: Nest's default HttpException envelope, also used verbatim by the single global SalesDomainExceptionFilter (statusCode/message differ, error is the class's HTTP reason phrase or domain error name). error is sometimes absent — a bare `new UnauthorizedException()` with no message omits it.
      properties:
        error:
          description: HTTP reason phrase or domain error class name. Not always present.
          type: string
        message:
          description: A single message, or one entry per failed validation constraint (ValidationPipe).
          oneOf:
            - type: string
            - items:
                type: string
              type: array
        statusCode:
          type: integer
      required:
        - statusCode
        - message
      type: object
    FinalizeCashSessionCloseDto:
      properties:
        approvalDecisionId:
          description: FR-OFF-015 — client-generated permanent id for THIS approval decision.
          type: string
        approvalRequestId:
          description: FR-OFF-015 — client-generated permanent id for THIS approval request.
          type: string
        comment:
          maxLength: 1000
          type: string
        decision:
          enum:
            - approved
            - rejected
          type: string
        managerEmployeeCode:
          description: The deciding manager's employee code — mirrors `PinLoginDto`.
          maxLength: 32
          type: string
        managerPin:
          description: 'FR-SEC-020: 4-8 digits. Never logged, never echoed.'
          pattern: ^\d{4,8}$
          type: string
        reason:
          description: FR-FIN-006 [M] — mandatory above tolerance. Non-blank.
          maxLength: 1000
          pattern: \S
          type: string
      required:
        - approvalRequestId
        - approvalDecisionId
        - decision
        - reason
        - managerEmployeeCode
        - managerPin
      type: object
    ForgotPasswordDto:
      properties:
        email:
          format: email
          maxLength: 255
          type: string
      required:
        - email
      type: object
    LinkModifierGroupDto:
      properties:
        defaultSelectionOverride:
          additionalProperties: true
          type: object
        modifierGroupId:
          type: string
        priceOverride:
          additionalProperties: true
          type: object
        sortOrder:
          maximum: 32767
          minimum: -32768
          type: number
      required:
        - modifierGroupId
      type: object
    LoginDto:
      properties:
        email:
          format: email
          maxLength: 255
          type: string
        password:
          maxLength: 256
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    ModifierRecipeEffectDto:
      properties:
        componentType:
          enum:
            - stock_item
            - sub_recipe
          type: string
        operation:
          enum:
            - add
            - remove_all
          type: string
        quantity:
          description: 6-dp decimal string. Required for `add`; forbidden for `remove_all`.
          type: string
        sequence:
          maximum: 32767
          minimum: 0
          type: number
        stockItemId:
          type: string
        subRecipeId:
          description: LOGICAL recipe identity — resolved to its published version at capture time.
          type: string
        unitId:
          description: Required for `add`; forbidden for `remove_all`.
          type: string
      required:
        - sequence
        - operation
        - componentType
      type: object
    OpenCashSessionDto:
      properties:
        cashSessionId:
          description: FR-OFF-015 — the ULID the device assigned to the session. Preserved exactly.
          type: string
        drawerId:
          type: string
        notes:
          description: Optional free-text note recorded with the opening.
          maxLength: 500
          type: string
        openingFloat:
          description: |-
            Declared opening float in MINOR UNITS, as an exact integer string.

            A string, not a number: a JSON number is IEEE-754 and money must never pass
            through one (ADR-008). "50000" is 500.00 in a 2-decimal currency; the
            currency itself comes from the branch, never from here.
          pattern: ^\d{1,18}$
          type: string
        shiftId:
          description: FR-OFF-015 — the ULID the device assigned to the shift. Preserved exactly.
          type: string
      required:
        - shiftId
        - cashSessionId
        - drawerId
        - openingFloat
      type: object
    OpenCountDto:
      properties:
        isBlindCount:
          type: boolean
        itemIds:
          items:
            type: string
          type: array
        locationId:
          type: string
        requiresApproval:
          description: 'B-2: caller-supplied approval gate; Inventory never evaluates a threshold.'
          type: boolean
        scopeId:
          type: string
        scopeType:
          enum:
            - full_location
            - category
            - item_list
          type: string
      required:
        - locationId
        - scopeType
      type: object
    PinLoginDto:
      properties:
        employeeCode:
          description: Employee code, not an email — a POS operator identifies by staff code.
          maxLength: 32
          minLength: 1
          type: string
        pin:
          description: 'FR-SEC-020: 4–8 digits. Never logged, never echoed.'
          pattern: ^\d{4,8}$
          type: string
        tenantId:
          type: string
        terminalId:
          type: string
      required:
        - tenantId
        - terminalId
        - employeeCode
        - pin
      type: object
    PlaceMenuItemDto:
      properties:
        categoryId:
          type: string
      required:
        - categoryId
      type: object
    PostMovementDto:
      properties:
        locationId:
          type: string
        movementType:
          enum:
            - purchase_receipt
            - purchase_return
            - sale_depletion
            - sale_reversal
            - transfer_out
            - transfer_in
            - production_input
            - production_output
            - waste
            - count_adjustment
            - manual_adjustment
            - opening_balance
            - expiry_writeoff
          type: string
        notes:
          maxLength: 500
          minLength: 1
          type: string
        quantity:
          type: string
        reasonCodeId:
          type: string
        referenceId:
          type: string
        referenceType:
          maxLength: 32
          minLength: 1
          type: string
        stockItemId:
          type: string
        unitCost:
          type: string
      required:
        - locationId
        - stockItemId
        - movementType
        - quantity
        - referenceType
        - referenceId
      type: object
    ReassignBrandDto:
      properties:
        brandId:
          type: string
      required:
        - brandId
      type: object
    ReceiveTransferDto:
      properties:
        discrepancyReasonCodeId:
          type: string
        receivedQuantity:
          type: string
        toLocationId:
          type: string
        transferReferenceId:
          type: string
      required:
        - toLocationId
        - transferReferenceId
        - receivedQuantity
      type: object
    RecipeLineDto:
      properties:
        componentType:
          enum:
            - stock_item
            - sub_recipe
          type: string
        isOptional:
          type: boolean
        quantity:
          description: 6-dp decimal carried as a string end to end (BR-CORE-003).
          type: string
        sequence:
          maximum: 32767
          minimum: 0
          type: number
        stockItemId:
          type: string
        subRecipeId:
          description: A sub-recipe component references LOGICAL RECIPE IDENTITY, not a version.
          type: string
        substituteGroupId:
          type: string
        unitId:
          description: MUST be a real `inventory.uom` id; Production Spec never creates UOMs.
          type: string
        wastagePercentage:
          type: string
      required:
        - sequence
        - componentType
        - quantity
        - unitId
      type: object
    RecordCountDto:
      properties:
        countedQuantity:
          type: string
      required:
        - countedQuantity
      type: object
    RecordWasteDto:
      properties:
        lines:
          items:
            $ref: '#/components/schemas/WasteLineDto'
          type: array
        locationId:
          type: string
        notes:
          maxLength: 500
          minLength: 1
          type: string
        reasonCodeId:
          type: string
        requiresApproval:
          description: 'B-2: caller-supplied approval gate.'
          type: boolean
      required:
        - locationId
        - reasonCodeId
        - lines
      type: object
    RefreshDto:
      properties:
        refreshToken:
          maxLength: 512
          minLength: 1
          type: string
      required:
        - refreshToken
      type: object
    RegisterTerminalDto:
      properties:
        appVersion:
          maxLength: 32
          type: string
        branchId:
          type: string
        deviceFingerprint:
          maxLength: 1024
          type: string
        name:
          maxLength: 64
          minLength: 1
          type: string
        os:
          maxLength: 32
          type: string
        terminalType:
          enum:
            - pos
            - kds
            - kiosk
            - handheld
          type: string
      required:
        - name
        - terminalType
        - branchId
      type: object
    ReplaceModifierRecipeEffectsDto:
      properties:
        effects:
          items:
            $ref: '#/components/schemas/ModifierRecipeEffectDto'
          type: array
      required:
        - effects
      type: object
    ReplaceRecipeLinesDto:
      properties:
        lines:
          items:
            $ref: '#/components/schemas/RecipeLineDto'
          type: array
      required:
        - lines
      type: object
    ResetPasswordDto:
      properties:
        newPassword:
          maxLength: 256
          minLength: 8
          type: string
        token:
          maxLength: 512
          minLength: 16
          type: string
      required:
        - token
        - newPassword
      type: object
    SelectTenantDto:
      properties:
        tenantId:
          type: string
      required:
        - tenantId
      type: object
    SetActiveDto:
      properties:
        isActive:
          type: boolean
      required:
        - isActive
      type: object
    SetBranchStatusDto:
      properties:
        status:
          enum:
            - active
            - inactive
          type: string
      required:
        - status
      type: object
    SetPriceEntryDto:
      properties:
        currency:
          maxLength: 3
          minLength: 3
          pattern: ^[A-Z]{3}$
          type: string
        menuItemVariantId:
          type: string
        price:
          pattern: ^-?\d{1,18}$
          type: string
      required:
        - menuItemVariantId
        - price
        - currency
      type: object
    SetReorderConfigDto:
      properties:
        locationId:
          type: string
        reorderPoint:
          type: string
        reorderQuantity:
          type: string
      required:
        - locationId
        - reorderPoint
        - reorderQuantity
      type: object
    SetTerminalStatusDto:
      properties:
        status:
          enum:
            - active
            - disabled
            - revoked
          type: string
      required:
        - status
      type: object
    Toggle86Dto:
      properties:
        autoReenableAt:
          type: string
        isManual86:
          type: boolean
        reasonText:
          maxLength: 500
          minLength: 1
          type: string
      required:
        - isManual86
      type: object
    UpdateBranchDto:
      properties:
        address:
          additionalProperties: true
          type: object
        automaticAvailability:
          type: boolean
        baseCurrency:
          pattern: ^[A-Z]{3}$
          type: string
        countryCode:
          pattern: ^[A-Z]{2}$
          type: string
        name:
          maxLength: 120
          minLength: 1
          type: string
        timezone:
          maxLength: 48
          minLength: 1
          type: string
      type: object
    UpdateBrandDto:
      properties:
        defaultSettings:
          additionalProperties: true
          type: object
        name:
          maxLength: 120
          minLength: 1
          type: string
        theme:
          additionalProperties: true
          type: object
      type: object
    UpdateCategoryDto:
      properties:
        colour:
          maxLength: 9
          minLength: 1
          type: string
        name:
          additionalProperties: true
          type: object
        parentCategoryId:
          type: string
        sortOrder:
          maximum: 32767
          minimum: -32768
          type: number
      type: object
    UpdateCentralKitchenDto:
      properties:
        name:
          maxLength: 120
          minLength: 1
          type: string
        warehouseId:
          type: string
      type: object
    UpdateMenuDto:
      properties:
        activeWindow:
          additionalProperties: true
          type: object
        name:
          additionalProperties: true
          type: object
        orderTypes:
          items:
            type: string
          type: array
        priority:
          maximum: 32767
          minimum: -32768
          type: number
      type: object
    UpdateMenuItemDto:
      properties:
        aggregatorNames:
          additionalProperties: true
          type: object
        allergens:
          items:
            type: string
          type: array
        barcodePlu:
          maxLength: 32
          minLength: 1
          type: string
        colour:
          maxLength: 9
          minLength: 1
          type: string
        description:
          additionalProperties: true
          type: object
        dietaryTags:
          items:
            type: string
          type: array
        isCombo:
          type: boolean
        isOpenPrice:
          type: boolean
        isWeighed:
          type: boolean
        kitchenNames:
          additionalProperties: true
          type: object
        names:
          additionalProperties: true
          type: object
        revenueAccountCode:
          maxLength: 32
          minLength: 1
          type: string
        sortOrder:
          maximum: 32767
          minimum: -32768
          type: number
        taxClassId:
          description: 'C-04: recorded only. Fiscal is out of scope, so this is never resolved.'
          type: string
      required:
        - names
      type: object
    UpdateModifierGroupDto:
      properties:
        allowRepeat:
          type: boolean
        freeQuantityThreshold:
          maximum: 32767
          minimum: 0
          type: number
        isRequired:
          type: boolean
        maxSelections:
          maximum: 32767
          minimum: 0
          type: number
        minSelections:
          maximum: 32767
          minimum: 0
          type: number
        name:
          additionalProperties: true
          type: object
      required:
        - name
      type: object
    UpdateStationDto:
      properties:
        capacityConfig:
          additionalProperties: true
          type: object
        displayColour:
          maxLength: 9
          minLength: 1
          type: string
        displayTerminalId:
          type: string
        name:
          maxLength: 64
          minLength: 1
          type: string
      type: object
    UpdateTableDto:
      properties:
        label:
          maxLength: 16
          minLength: 1
          type: string
        seatCapacity:
          maximum: 32767
          minimum: 1
          type: number
        section:
          maxLength: 64
          minLength: 1
          type: string
      type: object
    UpdateWarehouseDto:
      properties:
        branchId:
          type: string
        name:
          maxLength: 120
          minLength: 1
          type: string
        warehouseType:
          enum:
            - branch
            - central
            - virtual
          type: string
      type: object
    VoidOrderLineDto:
      properties:
        reasonCodeId:
          description: |-
            REQUIRED. FR-POS-013 demands a reason on a void, and the database agrees:
            `ck_order_line_void_reason` refuses a voided row without one. Making it
            optional here would only move the failure from a 400 to a 500.

            The reason catalogue is `inventory.reason_codes`; this references one by id
            and the service checks it is visible to the tenant.
          type: string
      required:
        - reasonCodeId
      type: object
    WasteLineDto:
      properties:
        quantity:
          type: string
        stockItemId:
          type: string
      required:
        - stockItemId
        - quantity
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: 'Access token issued by POST /auth/login, POST /auth/pin, or rotated by POST /auth/refresh. Sent as `Authorization: Bearer <token>`.'
      scheme: bearer
      type: http
info:
  contact: {}
  description: Restaurant Operating System backend API — the live, implemented HTTP surface of this NestJS backend. Endpoints not yet built (Fire, Payment, Completion, KDS bump/recall, and others the SRS describes but this repository has not implemented) are deliberately absent from this document, not merely undocumented.
  title: ROS Backend API
  version: 0.0.1
openapi: 3.1.0
paths:
  /auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    description: Access token lifetime in seconds.
                    type: integer
                  refreshToken:
                    type: string
                  tokenType:
                    enum:
                      - Bearer
                    type: string
                  user:
                    properties:
                      createdAt:
                        example: '2026-08-23T14:30:00.000Z'
                        format: date-time
                        type: string
                      displayName:
                        type: string
                      email:
                        format: email
                        type: string
                      id:
                        format: uuid
                        type: string
                      lastLoginAt:
                        example: '2026-08-23T14:30:00.000Z'
                        format: date-time
                        type:
                          - string
                          - 'null'
                      phone:
                        type:
                          - string
                          - 'null'
                      preferredLocale:
                        example: ar
                        type: string
                      status:
                        enum:
                          - active
                          - disabled
                          - locked
                        type: string
                      updatedAt:
                        example: '2026-08-23T14:30:00.000Z'
                        format: date-time
                        type: string
                    type: object
                type: object
          description: Access token, refresh token, and user.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid credentials.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Rate limit exceeded.
      summary: Authenticate with email + password.
      tags:
        - auth
  /auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      responses:
        '204':
          description: Current session revoked.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing/invalid/expired token.
      security:
        - bearer: []
      summary: Revoke the current session.
      tags:
        - auth
  /auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  createdAt:
                    example: '2026-08-23T14:30:00.000Z'
                    format: date-time
                    type: string
                  displayName:
                    type: string
                  email:
                    format: email
                    type: string
                  id:
                    format: uuid
                    type: string
                  lastLoginAt:
                    example: '2026-08-23T14:30:00.000Z'
                    format: date-time
                    type:
                      - string
                      - 'null'
                  mustReset:
                    type: boolean
                  phone:
                    type:
                      - string
                      - 'null'
                  preferredLocale:
                    example: ar
                    type: string
                  status:
                    enum:
                      - active
                      - disabled
                      - locked
                    type: string
                  updatedAt:
                    example: '2026-08-23T14:30:00.000Z'
                    format: date-time
                    type: string
                type: object
          description: The authenticated user (no credentials), plus whether their password must be reset before further use.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing/invalid/expired token.
      security:
        - bearer: []
      summary: The authenticated user.
      tags:
        - auth
  /auth/memberships/{membershipId}/roles:
    post:
      operationId: RbacController_assignRole
      parameters:
        - in: path
          name: membershipId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleDto'
        required: true
      responses:
        '204':
          description: Role assigned.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing/invalid/expired token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The role is a system role and cannot be assigned here.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The membership or role does not exist in this tenant.
      security:
        - bearer: []
      summary: Assign a role to a membership.
      tags:
        - rbac
  /auth/memberships/{membershipId}/roles/{roleId}:
    delete:
      operationId: RbacController_removeRole
      parameters:
        - in: path
          name: membershipId
          required: true
          schema:
            type: string
        - in: path
          name: roleId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Role removed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing/invalid/expired token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No tenant context / insufficient permission.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The membership does not exist in this tenant.
      security:
        - bearer: []
      summary: Remove a role from a membership.
      tags:
        - rbac
  /auth/password/change:
    post:
      operationId: PasswordController_change
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDto'
        required: true
      responses:
        '204':
          description: Password changed; other sessions revoked.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing token or wrong current password.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Rate limit exceeded.
      security:
        - bearer: []
      summary: Change password (proves the current password).
      tags:
        - password
  /auth/password/forgot:
    post:
      operationId: PasswordController_forgot
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordDto'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                properties:
                  status:
                    enum:
                      - accepted
                    type: string
                type: object
          description: Always accepted, whether or not the account exists — the response never discloses which.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Rate limit exceeded.
      summary: Request a password reset (no account enumeration).
      tags:
        - password
  /auth/password/reset:
    post:
      operationId: PasswordController_reset
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
        required: true
      responses:
        '204':
          description: Password reset; all sessions revoked.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid, expired, or already-used reset token.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Rate limit exceeded.
      summary: Complete a password reset with a single-use token.
      tags:
        - password
  /auth/permissions:
    get:
      operationId: RbacController_myPermissions
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  permissions:
                    items:
                      type: string
                    type: array
                type: object
          description: The caller's effective permission codes, sorted.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing/invalid/expired token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No tenant context / insufficient permission.
      security:
        - bearer: []
      summary: Effective permissions of the caller's active membership.
      tags:
        - rbac
  /auth/pin:
    post:
      operationId: AuthController_loginWithPin
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinLoginDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    description: Access token lifetime in seconds.
                    type: integer
                  refreshToken:
                    type: string
                  tokenType:
                    enum:
                      - Bearer
                    type: string
                  user:
                    properties:
                      createdAt:
                        example: '2026-08-23T14:30:00.000Z'
                        format: date-time
                        type: string
                      displayName:
                        type: string
                      email:
                        format: email
                        type: string
                      id:
                        format: uuid
                        type: string
                      lastLoginAt:
                        example: '2026-08-23T14:30:00.000Z'
                        format: date-time
                        type:
                          - string
                          - 'null'
                      phone:
                        type:
                          - string
                          - 'null'
                      preferredLocale:
                        example: ar
                        type: string
                      status:
                        enum:
                          - active
                          - disabled
                          - locked
                        type: string
                      updatedAt:
                        example: '2026-08-23T14:30:00.000Z'
                        format: date-time
                        type: string
                    type: object
                type: object
          description: Access token, refresh token, and user. The session is POS-only.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid PIN, unknown employee code, or unknown terminal/tenant.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Rate limit exceeded.
      summary: Authenticate with a terminal-scoped employee PIN (POS).
      tags:
        - auth
  /auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    description: Access token lifetime in seconds.
                    type: integer
                  refreshToken:
                    type: string
                  tokenType:
                    enum:
                      - Bearer
                    type: string
                  user:
                    properties:
                      createdAt:
                        example: '2026-08-23T14:30:00.000Z'
                        format: date-time
                        type: string
                      displayName:
                        type: string
                      email:
                        format: email
                        type: string
                      id:
                        format: uuid
                        type: string
                      lastLoginAt:
                        example: '2026-08-23T14:30:00.000Z'
                        format: date-time
                        type:
                          - string
                          - 'null'
                      phone:
                        type:
                          - string
                          - 'null'
                      preferredLocale:
                        example: ar
                        type: string
                      status:
                        enum:
                          - active
                          - disabled
                          - locked
                        type: string
                      updatedAt:
                        example: '2026-08-23T14:30:00.000Z'
                        format: date-time
                        type: string
                    type: object
                type: object
          description: A rotated access + refresh token pair.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid, expired, revoked, or reused refresh token.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Rate limit exceeded.
      summary: Rotate a refresh token for a new access + refresh token pair.
      tags:
        - auth
  /auth/roles:
    get:
      operationId: RbacController_listRoles
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  properties:
                    createdAt:
                      example: '2026-08-23T14:30:00.000Z'
                      format: date-time
                      type: string
                    description:
                      type:
                        - string
                        - 'null'
                    id:
                      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      format: uuid
                      type: string
                    isSystem:
                      type: boolean
                    name:
                      type: string
                    tenantId:
                      description: NULL for a platform/system role, shared across tenants.
                      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      format: uuid
                      type:
                        - string
                        - 'null'
                    updatedAt:
                      example: '2026-08-23T14:30:00.000Z'
                      format: date-time
                      type: string
                  type: object
                type: array
          description: Roles, system roles first, then by name.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing/invalid/expired token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No tenant context / insufficient permission.
      security:
        - bearer: []
      summary: 'Roles visible to the tenant: its own roles plus shared system roles.'
      tags:
        - rbac
    post:
      operationId: RbacController_createRole
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleDto'
