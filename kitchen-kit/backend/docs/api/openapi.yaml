                        example: '2026-08-23T14:30:00.000Z'
                        format: date-time
                        type: string
                      roundingAdjustment:
                        description: Minor-unit money amount as a decimal string (never a JSON number, to avoid IEEE-754 precision loss).
                        example: '1250'
                        pattern: ^-?\d+$
                        type: string
                      tender:
                        enum:
                          - cash
                          - manual_external_card
                        type: string
                      tenderedAmount:
                        description: Minor-unit money amount as a decimal string (never a JSON number, to avoid IEEE-754 precision loss).
                        example: '1250'
                        pattern: ^-?\d+$
                        type:
                          - string
                          - 'null'
                      terminalId:
                        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        format: uuid
                        type: string
                    type: object
                  remainingBalance:
                    description: Minor-unit money amount as a decimal string (never a JSON number, to avoid IEEE-754 precision loss).
                    example: '1250'
                    pattern: ^-?\d+$
                    type: string
                type: object
          description: The newly captured Payment and the order it now belongs to (paidTotal/roundingAdjustment/state/version updated).
          headers:
            ETag:
              description: Weak validator W/"<orderId>.<version>" for this order — send back as If-Match on the next mutation.
              schema:
                example: W/"3fa85f64-5717-4562-b3fc-2c963f66afa6.4"
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing/malformed If-Match, missing/over-long Idempotency-Key, a missing tender-specific field (tenderedAmountMinor for cash, terminalReference for card), or an otherwise invalid request body.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid access token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing the required permission.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unknown or cross-tenant resource.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The If-Match version is stale, the Idempotency-Key was already used with a different request body / is still in flight, or the same permanent Payment id was already used with different content.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The order is not in a state that accepts a payment, the cash session is invalid for this order (wrong branch/employee/terminal/currency, or not open), the tendered cash is insufficient, or (for a settling payment) a component has no pinned unit conversion and Completion cannot depute an exact quantity.
      security:
        - bearer: []
      summary: Capture a partial, or final settling, CASH or manual/external-card payment. A settling payment completes the order atomically.
      tags:
        - sales
