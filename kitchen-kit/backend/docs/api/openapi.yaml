  /orders/{businessDay}/{id}/payments:
    post:
      operationId: OrdersController_capturePayment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: |-
            `sales.orders` is partitioned by `business_day` and its primary key is
            (id, business_day), so a read needs both. It is a locator, not a claim
            about the order's content.
          in: path
          name: businessDay
          required: true
          schema:
            pattern: ^\d{4}-\d{2}-\d{2}$
