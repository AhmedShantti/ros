                    pattern: ^-?\d+$
                    type: string
                  openingFloatMinorUnits:
                    description: Minor-unit money amount as a decimal string (never a JSON number, to avoid IEEE-754 precision loss).
                    example: '1250'
                    pattern: ^-?\d+$
                    type: string
                  status:
                    enum:
                      - open
                      - closing
                      - closed
                    type: string
                  toleranceMinorUnits:
                    description: Present whenever a cash-close policy is configured for the branch — in BOTH blind and open mode. Absent only when no policy is configured at all.
                    example: '1250'
                    pattern: ^-?\d+$
                    type: string
                  varianceMinorUnits:
                    description: Present only once status is closing/closed.
                    example: '1250'
                    pattern: ^-?\d+$
                    type: string
                type: object
          description: The close context for this cash session.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid access token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing the required permission.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unknown cash session.
      security:
        - bearer: []
      summary: |-
        The close context — FR-POS-094/095. Read-only.

        `cash.session.close` (own) / `cash.session.close_other` (another
        employee's) — the SAME own/other split `declareClose`/`finalizeClose`
        enforce, checked here too so a caller cannot probe another employee's
        session state without holding the right authority.

        While `open` in BLIND mode (FR-POS-095's default), `toleranceMinorUnits`/
        `expectedCashMinorUnits` are structurally ABSENT from the response —
        never merely `null` — until a count is durably declared. While `open` in
        open-count mode, they are a PREVIEW only (not authoritative — the actual
        close re-resolves everything fresh, under the advisory lock).
      tags:
        - treasury
  /cash-sessions/{sessionId}/close/finalize:
    post:
      operationId: TreasuryController_finalizeClose
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
        - description: 'Opaque client-chosen key. A replay with the same key and request body returns the original result unchanged (Idempotent-Replay: true).'
          in: header
          name: idempotency-key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeCashSessionCloseDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  cashSessionId:
                    example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    format: uuid
                    type: string
                  outcome:
                    description: 'R-6(a): an explicit rejection COMMITS and returns 200 with outcome "rejected" — never an error. The session remains "closing"; a retry with fresh approvalRequestId/approvalDecisionId is expected.'
                    enum:
                      - closed
                      - rejected
                    type: string
                  status:
                    enum:
                      - closing
                      - closed
                    type: string
                type: object
          description: The manager decision outcome — "closed" (approved) or "rejected" (R-6(a); the session remains closing).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing/malformed approvalRequestId/approvalDecisionId, an invalid decision, a blank reason, or an otherwise invalid request body.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid manager PIN, terminal, or employee code.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The manager holds no cash.variance.approve permission, or is the excluded (self-approving) approver.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unknown cash session.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The session has no pending close awaiting a decision, is already closed under a different approval request, the owning employee has no linked Identity user (self-approval cannot be enforced), the governing cash-close policy could not be re-resolved identically, or the approval request/decision id already exists with different content.
      security:
        - bearer: []
      summary: |-
        The manager's decision on a frozen (above-tolerance) close — FR-FIN-006
        [M], FR-SEC-016/030/032/033.

        The manager PIN is verified BEFORE the business transaction opens
        (`identity/contract`'s `TERMINAL_PIN_VERIFIER` — a failed-attempt/
        lockout counter must survive a later rollback, and never runs at all on
        an idempotent replay). The verified manager's permission set — not the
        calling cashier's — is what `cash.variance.approve` is checked against,
        by the Approval Runtime itself, never by a route-level permission guard
        (the approver is a different actor than the caller).

        R-6(a): an explicit REJECTED decision COMMITS and returns 200 with
        `outcome: "rejected"` — never an error. The session stays `closing`; a
        retry supplies FRESH `approvalRequestId`/`approvalDecisionId` values.
      tags:
        - treasury
