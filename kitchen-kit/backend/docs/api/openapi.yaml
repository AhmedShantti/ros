                        format: uuid
                        type: string
                      closedAt:
                        example: '2026-08-23T14:30:00.000Z'
                        format: date-time
                        type:
                          - string
                          - 'null'
                      currency:
                        description: ISO 4217 currency code.
                        example: AED
                        type: string
                      drawerId:
                        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        format: uuid
                        type: string
                      employeeId:
                        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        format: uuid
                        type: string
                      id:
                        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        format: uuid
                        type: string
                      openedAt:
                        example: '2026-08-23T14:30:00.000Z'
                        format: date-time
                        type: string
                      openingFloat:
                        description: Minor-unit money amount as a decimal string (never a JSON number, to avoid IEEE-754 precision loss).
                        example: '1250'
                        pattern: ^-?\d+$
                        type: string
