        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing/over-long Idempotency-Key, a non-ULID shiftId/cashSessionId/drawerId, shiftId equal to cashSessionId, or an otherwise invalid request body.
