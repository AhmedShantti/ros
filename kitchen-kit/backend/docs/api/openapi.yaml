                        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        format: uuid
                        type: string
                      status:
                        enum:
                          - open
                          - closing
                          - closed
                        type: string
                    type: object
                  created:
                    type: boolean
                  shift:
                    properties:
                      branchId:
                        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        format: uuid
                        type: string
                      employeeId:
                        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        format: uuid
                        type: string
                      id:
