                  created:
                    description: False on an idempotent replay of an already-declared attempt.
                    type: boolean
                  currency:
                    description: ISO 4217 currency code.
                    example: AED
                    type: string
                  expectedCashMinorUnits:
                    description: Disclosed only in this COMMITTED response — never before the count is durable (FR-POS-095).
                    example: '1250'
                    pattern: ^-?\d+$
                    type: string
                  status:
                    enum:
                      - closing
                      - closed
                    type: string
                  toleranceMinorUnits:
                    description: Minor-unit money amount as a decimal string (never a JSON number, to avoid IEEE-754 precision loss).
                    example: '1250'
                    pattern: ^-?\d+$
                    type: string
                  varianceMinorUnits:
                    description: Minor-unit money amount as a decimal string (never a JSON number, to avoid IEEE-754 precision loss).
                    example: '1250'
                    pattern: ^-?\d+$
                    type: string
                type: object
          description: The committed count declaration — closed immediately if within tolerance, otherwise frozen awaiting a manager decision.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing/malformed closeAttemptId, neither countedTotalMinorUnits nor denominations supplied, a denomination-sum mismatch, or a duplicate denomination.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid access token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing the required permission.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unknown cash session.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The session is not open, the closeAttemptId already exists with different content (FR-OFF-015), no cash-close policy is configured for this branch as of when the session opened, or the policy currency does not match the session.
      security:
        - bearer: []
      summary: |-
        Declare the physical cash count — FR-POS-094/096/097 [M].

        Within tolerance, this closes the session in the SAME request. Above
        tolerance, it freezes the session (`open -> closing`) and the disclosed
        figures in THIS response are the first and only legitimate disclosure —
        FR-POS-095's blind-count control is that expected cash/variance are
        revealed strictly AFTER the count is durably committed, never before.
        `POST .../close/finalize` is the ONLY way out of `closing` — there is no
        above-tolerance one-request path (a manager PIN entered before this
        response exists could not be an informed decision).
      tags:
        - treasury
