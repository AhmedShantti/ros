# ROS backend API alert rules — SRS §27.6 NFR-OBS-006 ("Alerts defined for
# every SLO breach with documented runbooks").
#
# Standard Prometheus alerting-rule format (a `groups: [...]` document, each
# group holding `rules: [{alert, expr, for, labels, annotations}]`), chosen
# because it is an OPEN, widely-supported format any Prometheus-compatible
# alert evaluator (Prometheus itself, Thanos ruler, Cortex/Mimir, Grafana
# Alerting's Prometheus-rule import) can load without a proprietary adapter.
#
# ── SCOPE (NFR-OBS-006 claim discipline — see the accompanying report) ───────
# This file covers the backend API SLOs this slice's own RED metrics
# (`http_requests_total`, `http_request_duration_seconds`,
# `src/common/observability/metrics/metrics.service.ts`) can ACTUALLY measure:
# API error rate and the two documented API latency NFRs. It does NOT cover
# every SLO in the SRS — see the report's "uncovered SLOs" section for the
# enumerated remainder (client/offline/POS availability, sync backlog, fiscal,
# uptime commitments requiring an external prober). NFR-OBS-006 is reported
# PARTIAL, not COMPLETE, for exactly that reason.
#
# ── DEPLOYMENT IS AN OPERATIONAL REQUIREMENT, NOT CLAIMED HERE ───────────────
# This file defines rules; it does not itself run an alert evaluator, route a
# page, or deploy an Alertmanager. Loading it into a running Prometheus/
# Alertmanager (or equivalent) and configuring the metrics scrape target
# (`MetricsExporterService`, disabled by default — see that file's docblock)
# is deployment configuration outside this repository slice.
groups:
  - name: ros-backend-api.rules
    rules:
      # ── NFR-OBS-006 / API error rate ────────────────────────────────────
      # No SRS-stated numeric error-rate SLO exists for the API; 5% sustained
      # server-error rate is an IMPLEMENTATION-level threshold (documented
      # here, not hidden), following this repository's own convention of
      # explicit implementation defaults (see e.g. `PIN_MAX_FAILED_ATTEMPTS`
      # in `src/config/env.validation.ts`).
      - alert: ROSBackendElevatedErrorRate
        expr: >-
          (
            sum(rate(http_requests_total{status_class="5xx"}[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          slo: api-error-rate
        annotations:
          summary: 'ROS backend API 5xx rate above 5% for 5 minutes'
          description: >-
            Server-error rate across all endpoints has exceeded 5% for at
            least 5 minutes. See the runbook for diagnosis and mitigation.
          runbook_url: 'docs/observability/runbooks/elevated-error-rate.md'
          metric_query: >-
            sum(rate(http_requests_total{status_class="5xx"}[5m])) /
            sum(rate(http_requests_total[5m]))

      # ── NFR-PERF-030: API read endpoints p95 <= 200ms ───────────────────
      - alert: ROSBackendReadLatencyP95Breach
        expr: >-
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{method="GET"}[5m])) by (le)
          ) > 0.2
        for: 5m
        labels:
          severity: warning
          slo: NFR-PERF-030
        annotations:
          summary: 'ROS backend read (GET) p95 latency above 200ms'
          description: >-
            NFR-PERF-030 requires read endpoints to respond within 200ms at
            p95. The measured p95 across all GET endpoints has exceeded that
            for at least 5 minutes.
          runbook_url: 'docs/observability/runbooks/read-latency-p95-breach.md'
          metric_query: >-
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{method="GET"}[5m])) by (le))

      # ── NFR-PERF-031: API write endpoints p95 <= 400ms ──────────────────
      - alert: ROSBackendWriteLatencyP95Breach
        expr: >-
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{method=~"POST|PUT|PATCH|DELETE"}[5m])) by (le)
          ) > 0.4
        for: 5m
        labels:
          severity: warning
          slo: NFR-PERF-031
        annotations:
          summary: 'ROS backend write p95 latency above 400ms'
          description: >-
            NFR-PERF-031 requires write endpoints to respond within 400ms at
            p95. The measured p95 across POST/PUT/PATCH/DELETE endpoints has
            exceeded that for at least 5 minutes.
          runbook_url: 'docs/observability/runbooks/write-latency-p95-breach.md'
          metric_query: >-
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{method=~"POST|PUT|PATCH|DELETE"}[5m])) by (le))

      # ── Metrics exporter/scrape unavailable ─────────────────────────────
      # Depends on Prometheus's own `up` metric for the configured scrape
      # job — REQUIRES the operational scrape-target wiring described above;
      # the job label name here (`ros-backend-metrics`) is a naming
      # convention this rule assumes a deployment's scrape config will use,
      # not something this repository enforces.
      - alert: ROSBackendMetricsScrapeDown
        expr: up{job="ros-backend-metrics"} == 0
        for: 5m
        labels:
          severity: critical
          slo: metrics-availability
        annotations:
          summary: 'ROS backend metrics exporter unreachable'
          description: >-
            Prometheus has been unable to scrape the ROS backend metrics
            exporter for at least 5 minutes. RED metrics and every alert
            above are blind while this is firing.
          runbook_url: 'docs/observability/runbooks/metrics-exporter-unavailable.md'
          metric_query: 'up{job="ros-backend-metrics"}'

      # ── SCHED-1: scheduled job execution ────────────────────────────────
      # These three cover the scheduler substrate itself (migration 39,
      # `platform.job_occurrences`). They are the operational half of the
      # SRS's "SHALL raise an alert" clauses for scheduled verification jobs:
      # they fire on the SUBSTRATE failing or falling behind. Whether a job
      # DETECTED something is a separate signal, alerted below.
      #
      # DELIVERY REMAINS UNIMPLEMENTED. As with every rule in this file,
      # defining a rule is not running an alert evaluator. Loading this into a
      # Prometheus/Alertmanager and routing the page is deployment
      # configuration outside this repository — which is exactly why the alert
      # limb of BR-INV-003 / FR-INV-011 / FR-INV-051 is reported PARTIAL, not
      # COMPLETE, in the SCHED-1 report.
      - alert: ROSScheduledJobFailures
        expr: >-
          sum by (job_type) (
            rate(scheduled_job_occurrences_total{phase="failed"}[15m])
          ) > 0
        for: 15m
        labels:
          severity: critical
          slo: scheduled-job-success
        annotations:
          summary: 'ROS scheduled job {{ $labels.job_type }} is failing terminally'
          description: >-
            A scheduled job occurrence has exhausted its attempts or failed
            permanently. The occurrence row in platform.job_occurrences carries
            the bounded outcome_code; the structured log carries the exception
            class and message.
          runbook_url: 'docs/observability/runbooks/scheduled-job-failure.md'
          metric_query: >-
            sum by (job_type) (rate(scheduled_job_occurrences_total{phase="failed"}[15m]))

      - alert: ROSScheduledJobLagBreach
        expr: >-
          histogram_quantile(
            0.95,
            sum(rate(scheduled_job_lag_seconds_bucket[1h])) by (le, job_type)
          ) > 21600
        for: 30m
        labels:
          severity: warning
          slo: scheduled-job-timeliness
        annotations:
          summary: 'ROS scheduled job {{ $labels.job_type }} is running more than 6h late'
          description: >-
            Occurrences are being claimed long after their scheduled instant.
            A DAILY verification job that runs six hours late has not failed,
            but it is no longer answering the question it was scheduled to
            answer. Common causes: no instance has SCHEDULER_ENABLED=true, the
            tenant batch is too small for the fleet, or ticks are erroring.
          runbook_url: 'docs/observability/runbooks/scheduled-job-lag.md'
          metric_query: >-
            histogram_quantile(0.95, sum(rate(scheduled_job_lag_seconds_bucket[1h])) by (le, job_type))

      # ── BR-INV-003 / FR-INV-011 / FR-INV-051 ───────────────────────────
      # The DETECTION signal. `scheduled_job_findings_total` is incremented ONLY
      # after the transaction that persisted a `platform.job_findings` row has
      # committed, so this cannot fire on an attempt that rolled back.
      #
      # The metric carries job type and severity, NOT the tenant and NOT the
      # divergence count: a per-tenant label would be unbounded cardinality.
      # The alert therefore says "a critical finding exists"; the durable
      # `platform.job_findings` row says which tenant and what diverged, and is
      # the authoritative record.
      - alert: ROSInventoryLedgerProjectionDivergence
        expr: >-
          increase(
            scheduled_job_findings_total{job_type="inventory.daily_reconciliation",severity="critical"}[1d]
          ) > 0
        for: 0m
        labels:
          severity: critical
          slo: BR-INV-003
        annotations:
          summary: 'ROS inventory ledger and stock_levels projection disagree'
          description: >-
            The daily reconciliation job found at least one (item, location)
            pair whose movement-ledger sum does not equal its stock_levels
            projection. BR-INV-003 requires these to be equal. Nothing has been
            auto-corrected — the divergence is evidence and must be diagnosed
            before either side is touched.
          runbook_url: 'docs/observability/runbooks/inventory-ledger-divergence.md'
          metric_query: >-
            increase(scheduled_job_findings_total{job_type="inventory.daily_reconciliation",severity="critical"}[1d])

      # ── FR-DR-002: automated partition-lifecycle creation failure ────────
      - alert: ROSPartitionLifecycleCreationFailed
        expr: >-
          increase(
            scheduled_job_findings_total{job_type="platform.partition_lifecycle",severity="critical"}[1d]
          ) > 0
        for: 0m
        labels:
          severity: critical
          slo: FR-DR-002
        annotations:
          summary: 'ROS partition-lifecycle job failed to create a required partition'
          description: >-
            The scheduled partition-maintenance job (FR-DR-002) recorded at
            least one table/month it could not create a partition for. Left
            unaddressed, a write that lands past the last existing partition
            will fail outright once the horizon is exhausted. Diagnose via the
            finding's `detail.failures` (table, month, error) before the
            horizon runs out.
          runbook_url: 'docs/observability/runbooks/partition-lifecycle-failure.md'
          metric_query: >-
            increase(scheduled_job_findings_total{job_type="platform.partition_lifecycle",severity="critical"}[1d])

      # ── FR-AUD-005 ───────────────────────────────────────────────────
      # AUD-1's DETECTION signal, same shape and same caveats as
      # ROSInventoryLedgerProjectionDivergence above: incremented ONLY after
      # the transaction that persisted a platform.job_findings row committed.
      - alert: ROSAuditChainIntegrityBroken
        expr: >-
          increase(
            scheduled_job_findings_total{job_type="governance.audit_chain_verification",severity="critical"}[1d]
          ) > 0
        for: 0m
        labels:
          severity: critical
          slo: FR-AUD-005
        annotations:
          summary: 'ROS audit hash chain failed verification for at least one tenant'
          description: >-
            The scheduled job governance.audit_chain_verification recomputed
            a tenant's governance.audit_entries hash chain and found content
            tampering, a broken previous_hash linkage, a bad genesis, or a
            sequence gap/duplicate. FR-AUD-005 requires this to raise a
            platform-level security alert. This is the alert; nothing has
            been repaired or re-signed.
          runbook_url: 'docs/observability/runbooks/audit-chain-integrity-broken.md'
          metric_query: >-
            increase(scheduled_job_findings_total{job_type="governance.audit_chain_verification",severity="critical"}[1d])
